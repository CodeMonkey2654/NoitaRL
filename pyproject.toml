[project]
name = "noitarl"
version = "0.0.1"
description = "Train agents on Crafter and Noita with MLflow."
requires-python = ">=3.12"
dependencies = [
    "crafter>=1.8.3",
    "gymnasium>=1.0",
    "matplotlib>=3.11.2",
    "mlflow>=2.0",
    "numpy>=1.26",
    "pillow>=10",
    "pot>=0.9.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "torch>=2.2",
    "websockets>=17.2",
]

[project.scripts]
noitarl = "noitarl.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "ty>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/noitarl"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
markers = [
    "game: requires a running Noita instance on Windows",
]
addopts = "-m 'not game'"
